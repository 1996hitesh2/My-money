<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f7f8">
<title>My Money</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f6f8;
  color: #171717;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
  padding-bottom: 90px;
}

header {
  padding: 50px 18px 12px;
  font-size: 30px;
  font-weight: 800;
}

.screen {
  display: none;
  padding: 0 16px;
}

.screen.active {
  display: block;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 18px;
  margin: 10px 0;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.label {
  color: #777;
  font-size: 13px;
}

.big {
  font-size: 34px;
  font-weight: 800;
  margin: 5px 0 15px;
}

.progress {
  height: 9px;
  background: #e8e8ec;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #1677ff;
  border-radius: 10px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  background: #f8f8fa;
  border-radius: 15px;
  padding: 13px;
}

.stat b {
  display: block;
  font-size: 18px;
  margin-top: 5px;
}

h2 {
  font-size: 22px;
  margin: 20px 0 8px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.row:last-child {
  border-bottom: none;
}

.icon {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: #eef4ff;
  display: grid;
  place-items: center;
  font-size: 21px;
}

.grow {
  flex: 1;
}

.amount {
  font-weight: 700;
}

.muted {
  color: #888;
  font-size: 12px;
  margin-top: 3px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 13px 16px;
  background: #1677ff;
  color: white;
  font-size: 15px;
  font-weight: 700;
}

button.secondary {
  background: #eeeeef;
  color: #222;
}

button.delete {
  background: #fff0f0;
  color: #d33;
  padding: 5px 8px;
  font-size: 11px;
  margin-top: 5px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 13px;
  background: white;
  font-size: 16px;
  margin: 6px 0 14px;
}

label {
  color: #777;
  font-size: 13px;
}

.form-buttons {
  display: flex;
  gap: 10px;
}

.form-buttons button {
  flex: 1;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 76px;
  background: rgba(255,255,255,.95);
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  z-index: 10;
}

nav button {
  background: none;
  color: #777;
  padding: 8px 5px;
  border-radius: 0;
  font-size: 11px;
}

nav button.active {
  color: #1677ff;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.fab {
  position: fixed;
  right: 20px;
  bottom: 95px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 28px;
  padding: 0;
  box-shadow: 0 8px 25px rgba(22,119,255,.35);
}

.empty {
  text-align: center;
  color: #888;
  padding: 35px 10px;
}

.pill {
  display: inline-block;
  background: #fff0d5;
  color: #a56400;
  padding: 4px 7px;
  border-radius: 7px;
  font-size: 10px;
}
</style>
</head>

<body>

<header id="pageTitle">My Money</header>

<!-- HOME -->
<section id="home" class="screen active">

<div class="card">

<div class="label">Total Budget</div>

<div class="big" id="totalBudget">₹50,000</div>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

<div class="grid">

<div class="stat">
<div class="label">Spent</div>
<b id="spent">₹0</b>
</div>

<div class="stat">
<div class="label">Upcoming</div>
<b id="upcoming">₹0</b>
</div>

<div class="stat">
<div class="label">Projected Left</div>
<b id="remaining">₹50,000</b>
</div>

<div class="stat">
<div class="label">Expenses</div>
<b id="expenseCount">0</b>
</div>

</div>
</div>

<h2>Recent Expenses</h2>

<div class="card" id="recentExpenses"></div>

<button class="fab" onclick="openAdd(false)">＋</button>

</section>


<!-- UPCOMING -->
<section id="upcomingPage" class="screen">

<div class="card">

<div class="label">Total Upcoming Expenses</div>

<div class="big" id="upcomingTotal">₹0</div>

</div>

<div class="card" id="upcomingList"></div>

<button onclick="openAdd(true)">
＋ Add Upcoming Expense
</button>

</section>


<!-- HISTORY -->
<section id="historyPage" class="screen">

<h2>Expense History</h2>

<div class="card" id="historyList"></div>

</section>


<!-- BUDGET -->
<section id="budgetPage" class="screen">

<div class="card">

<h2 style="margin-top:0">Monthly Budget</h2>

<label>Total Budget</label>

<input
id="budgetInput"
type="number"
inputmode="decimal"
placeholder="50000">

<button onclick="saveBudget()">
Save Budget
</button>

</div>

<div class="card">

<h2 style="margin-top:0">Summary</h2>

<div class="row">
<span class="grow">Total Budget</span>
<b id="summaryBudget"></b>
</div>

<div class="row">
<span class="grow">Spent</span>
<b id="summarySpent"></b>
</div>

<div class="row">
<span class="grow">Upcoming</span>
<b id="summaryUpcoming"></b>
</div>

<div class="row">
<span class="grow">Projected Remaining</span>
<b id="summaryRemaining"></b>
</div>

</div>

</section>


<!-- ADD EXPENSE -->
<section id="addPage" class="screen">

<div class="card">

<h2 style="margin-top:0">Add Expense</h2>

<label>Expense Name</label>

<input
id="expenseName"
placeholder="e.g. Electricity">

<label>Amount</label>

<input
id="expenseAmount"
type="number"
inputmode="decimal"
placeholder="₹0">

<label>Category</label>

<select id="expenseCategory">

<option>Food</option>
<option>Transport</option>
<option>Shopping</option>
<option>Bills</option>
<option>Rent</option>
<option>Health</option>
<option>Entertainment</option>
<option>Other</option>

</select>

<label>Date</label>

<input id="expenseDate" type="date">

<br>

<label>
<input id="upcomingCheck" type="checkbox" style="width:auto">
Upcoming Expense
</label>

<br><br>

<label>
<input id="recurringCheck" type="checkbox" style="width:auto">
Recurring Expense
</label>

<br><br>

<label>Note</label>

<input
id="expenseNote"
placeholder="Optional">

<div class="form-buttons">

<button class="secondary" onclick="go('home')">
Cancel
</button>

<button onclick="addExpense()">
Save
</button>

</div>

</div>

</section>


<!-- NAVIGATION -->

<nav>

<button id="navHome"
class="active"
onclick="go('home')">

<span class="nav-icon">⌂</span>
Home

</button>

<button id="navUpcoming"
onclick="go('upcomingPage')">

<span class="nav-icon">◷</span>
Upcoming

</button>

<button id="navHistory"
onclick="go('historyPage')">

<span class="nav-icon">☷</span>
History

</button>

<button id="navBudget"
onclick="go('budgetPage')">

<span class="nav-icon">◉</span>
Budget

</button>

</nav>


<script>

const STORAGE_KEY = "MY_MONEY_DATA";

let data =
JSON.parse(localStorage.getItem(STORAGE_KEY)) ||
{
budget:50000,
expenses:[]
};


const icons = {

Food:"🍔",
Transport:"🚗",
Shopping:"🛍️",
Bills:"💡",
Rent:"🏠",
Health:"❤️",
Entertainment:"🎬",
Other:"📌"

};


function money(value){

return "₹" +
Math.round(value || 0)
.toLocaleString("en-IN");

}


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function calculate(){

let spent =
data.expenses
.filter(e => !e.upcoming)
.reduce(
(total,e) => total + e.amount,
0
);

let upcoming =
data.expenses
.filter(e => e.upcoming)
.reduce(
(total,e) => total + e.amount,
0
);

return {

spent,
upcoming,
remaining:
data.budget - spent - upcoming

};

}


function formatDate(date){

return new Date(
date + "T00:00:00"
).toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


function escapeText(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function expenseRow(expense){

return `

<div class="row">

<div class="icon">

${icons[expense.category] || "📌"}

</div>

<div class="grow">

<b>
${escapeText(expense.name)}
</b>

<div class="muted">

${expense.category}
·
${formatDate(expense.date)}

${expense.recurring ? " · Recurring" : ""}

</div>

</div>

<div style="text-align:right">

<div class="amount">

${money(expense.amount)}

</div>

${expense.upcoming
? '<span class="pill">Upcoming</span>'
: ''}

<br>

<button
class="delete"
onclick="deleteExpense('${expense.id}')">

Delete

</button>

</div>

</div>

`;

}


function render(){

let totals = calculate();

document.getElementById("totalBudget")
.textContent = money(data.budget);

document.getElementById("spent")
.textContent = money(totals.spent);

document.getElementById("upcoming")
.textContent = money(totals.upcoming);

document.getElementById("remaining")
.textContent = money(totals.remaining);

document.getElementById("expenseCount")
.textContent = data.expenses.length;

document.getElementById("upcomingTotal")
.textContent = money(totals.upcoming);


let percentage =
data.budget > 0
? (totals.spent / data.budget) * 100
: 0;

document.getElementById("progressBar")
.style.width =
Math.min(100,percentage) + "%";


let sorted =
[...data.expenses]
.sort(
(a,b)=>
new Date(b.date)-new Date(a.date)
);


document.getElementById("recentExpenses")
.innerHTML =
sorted
.slice(0,5)
.map(expenseRow)
.join("")
||
`<div class="empty">
No expenses yet.<br>
Tap ＋ to add your first expense.
</div>`;


let upcoming =
sorted.filter(e=>e.upcoming);


document.getElementById("upcomingList")
.innerHTML =
upcoming
.map(expenseRow)
.join("")
||
`<div class="empty">
No upcoming expenses.
</div>`;


document.getElementById("historyList")
.innerHTML =
sorted
.map(expenseRow)
.join("")
||
`<div class="empty">
No expense history.
</div>`;


document.getElementById("budgetInput")
.value = data.budget;


document.getElementById("summaryBudget")
.textContent = money(data.budget);

document.getElementById("summarySpent")
.textContent = money(totals.spent);

document.getElementById("summaryUpcoming")
.textContent = money(totals.upcoming);

document.getElementById("summaryRemaining")
.textContent = money(totals.remaining);

}


function go(page){

document
.querySelectorAll(".screen")
.forEach(
screen =>
screen.classList.remove("active")
);


document
.getElementById(page)
.classList.add("active");


document
.querySelectorAll("nav button")
.forEach(
button =>
button.classList.remove("active")
);


if(page==="home"){

navHome.classList.add("active");

pageTitle.textContent =
"My Money";

}

else if(page==="upcomingPage"){

navUpcoming.classList.add("active");

pageTitle.textContent =
"Upcoming Expenses";

}

else if(page==="historyPage"){

navHistory.classList.add("active");

pageTitle.textContent =
"Expense History";

}

else if(page==="budgetPage"){

navBudget.classList.add("active");

pageTitle.textContent =
"Budget";

}

else{

pageTitle.textContent =
"Add Expense";

}


render();

window.scrollTo(0,0);

}


function openAdd(isUpcoming){

go("addPage");

document.getElementById(
"upcomingCheck"
).checked = isUpcoming;


document.getElementById(
"expenseDate"
).value =
new Date()
.toISOString()
.slice(0,10);

}


function addExpense(){

let name =
document
.getElementById("expenseName")
.value
.trim();


let amount =
Number(
document
.getElementById("expenseAmount")
.value
);


if(!name || !amount || amount <= 0){

alert(
"Please enter an expense name and valid amount."
);

return;

}


let expense = {

id:
Date.now().toString(),

name:name,

amount:amount,

category:
document.getElementById(
"expenseCategory"
).value,

date:
document.getElementById(
"expenseDate"
).value,

upcoming:
document.getElementById(
"upcomingCheck"
).checked,

recurring:
document.getElementById(
"recurringCheck"
).checked,

note:
document.getElementById(
"expenseNote"
).value

};


data.expenses.push(expense);

save();

document.getElementById(
"expenseName"
).value="";

document.getElementById(
"expenseAmount"
).value="";

document.getElementById(
"expenseNote"
).value="";

go("home");

}


function deleteExpense(id){

if(
confirm(
"Delete this expense?"
)
){

data.expenses =
data.expenses.filter(
expense =>
expense.id !== id
);

save();

render();

}

}


function saveBudget(){

let amount =
Number(
document.getElementById(
"budgetInput"
).value
);


if(amount < 0){

alert("Budget cannot be negative.");

return;

}


data.budget = amount;

save();

render();

alert("Budget saved.");

}


render();

</script>

</body>
</html>
